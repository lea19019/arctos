# Q2 config — Aya Expanse 8B
model:
  name: aya-expanse-8b
  loader: src.models.aya.load_aya
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_pairs: 100             # clean/corrupt MT pairs per language pair
  corrupt_strategies:
    - lexical_sub
    - lang_id_swap
    - target_shuffle

patching:
  sites:
    - head_z
  metric: logit_diff       # see src.interp.activation_patching.PatchMetric
  layers: all
  heads: all

ablation:
  enabled: true
  top_k: 20

attention_viz:
  enabled: true
  top_k: 10

output:
  dir: results/aya/q2
