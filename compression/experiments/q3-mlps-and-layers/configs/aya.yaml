# Q3 config — Aya Expanse 8B
model:
  name: aya-expanse-8b
  loader: src.models.aya.load_aya
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200

patching:
  sites:
    - mlp_out
    - resid_post
  metric: logit_diff
  layers: all

ifr:
  target_position: all_target

probing:
  enabled: false           # turn on if Q1 motivates per-MLP probing
  source: mlp_out
  classes:
    - source_language_id

output:
  dir: results/aya/q3
