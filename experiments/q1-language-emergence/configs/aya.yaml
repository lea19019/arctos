# Q1 config — Aya Expanse 8B
model:
  name: aya-expanse-8b
  loader: src.models.aya.load_aya
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200          # per language pair
  source: wmt22-test       # see src/data/wmt.py

probing:
  classes:
    - source_language_id
    - target_language_id
  probe: linear            # vs "mlp"
  control_task: true       # Hewitt & Liang 2019
  train_frac: 0.8

logit_lens:
  variant: vanilla         # "vanilla" | "tuned"
  position: last
  track_target_tokens: true
  target_prefix_tokens: 8  # number of gold-target tokens to track mass on

ifr:
  target_position: last

output:
  dir: results/aya-expanse-8b/q1
