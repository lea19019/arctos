# Q1 config — Gemma-3-12B-it (Google, 2025 — WMT25 entry). BASELINE ONLY.
model:
  name: gemma-3-12b-it
  loader: src.models.gemma3.load_gemma3
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200
  source: flores+-dev

probing:
  classes: [source_language_id, target_language_id]
  probe: linear
  control_task: true
  train_frac: 0.8

logit_lens:
  variant: vanilla
  position: last
  track_target_tokens: true
  target_prefix_tokens: 8

ifr:
  target_position: last

output:
  dir: results/gemma-3-12b-it/q1
