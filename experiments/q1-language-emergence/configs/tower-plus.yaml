# Q1 config — Tower-Plus-9B (Unbabel, 2025 — Gemma2 base + bilingual CPT + MT-SFT).
model:
  name: tower-plus-9b
  loader: src.models.tower_plus.load_tower_plus
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200
  source: flores+-dev

probing:
  classes:
    - source_language_id
    - target_language_id
  probe: linear
  control_task: true
  train_frac: 0.8

logit_lens:
  variant: vanilla
  position: last
  track_target_tokens: true
  target_prefix_tokens: 8

ifr:
  target_position: last

output:
  dir: results/tower-plus-9b/q1
