# Q1 config — TowerInstruct-7B
model:
  name: tower-instruct-7b
  loader: src.models.tower.load_tower
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200
  source: wmt22-test

probing:
  classes:
    - source_language_id
    - target_language_id
  probe: linear
  control_task: true
  train_frac: 0.8

logit_lens:
  variant: vanilla
  position: last
  track_target_tokens: true

ifr:
  target_position: all_target

output:
  dir: results/tower/q1
