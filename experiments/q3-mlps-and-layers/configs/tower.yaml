# Q3 config — TowerInstruct-7B
model:
  name: tower-instruct-7b
  loader: src.models.tower.load_tower
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

calibration:
  n_examples: 200

patching:
  sites:
    - mlp_out
    - resid_post
  metric: logit_diff
  layers: all

ifr:
  target_position: all_target

probing:
  enabled: false
  source: mlp_out
  classes:
    - source_language_id

output:
  dir: results/tower/q3
