# Q4 config — Aya component
# Q4 reads existing Q1/Q2/Q3 outputs and synthesizes — no new computation
# beyond an optional re-run on a shared example set.
model:
  name: aya-expanse-8b
  loader: src.models.aya.load_aya
  dtype: bfloat16
  device: cuda

language_pairs:
  - cs-de
  - en-zh
  - en-arz

shared_examples:
  source: q4_shared_set    # see src/data/wmt.py — fixed across all three models
  n: 50

inputs:
  - results/aya/q1
  - results/aya/q2
  - results/aya/q3

output:
  dir: results/aya/q4
