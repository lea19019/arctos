# EuroLLM-9B-Instruct used as a plain LM: no chat template, raw continuation (recorded in provenance).
model: utter-project/EuroLLM-9B-Instruct
languages: [eng_Latn, spa_Latn, fra_Latn, por_Latn, deu_Latn, cmn_Hans, rus_Cyrl, ces_Latn, ita_Latn, nld_Latn]
n_prompts: 200
prefix_tokens: 50
max_new_tokens: 256
batch_size: 16
seed: 0
out_dir: results/loops_pilot
