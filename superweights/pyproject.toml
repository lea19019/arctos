[project]
name = "arctos-superweights"
version = "0.1.0"
description = "Formation and behavior of super weights: when they form, whether they are shared across languages, and what they cost at quantization"
requires-python = ">=3.11"
# Intentionally empty. Phase 0 (the calibrated detector) has not been through
# /new-experiment yet, and pinning a modeling stack before the spec exists is
# exactly the ordering this repo avoids. Add dependencies as the spec names
# them — and when torch lands here, copy the Linux-marker pattern from
# ../compression/pyproject.toml so the track still installs on macOS.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
