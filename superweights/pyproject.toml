[project]
name = "arctos-superweights"
version = "0.1.0"
description = "Formation and behavior of super weights: when they form, whether they are shared across languages, and what they cost at quantization"
requires-python = ">=3.11"
# Tier A scratch deps (Yu et al. replication). Phase 0 additions still go
# through /new-experiment first.
dependencies = [
    "datasets>=3.0",
    "matplotlib>=3.11.1",
    "torch>=2.4",
    "transformers>=5.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pin torch to the CUDA 12.8 wheel index on Linux only (same reasoning as
# ../compression/pyproject.toml): the BYU RC cluster driver supports up to
# CUDA 12.8, and the default cu130 wheel fails there at runtime. The cu128
# index ships no macOS wheels, so the marker lets a Mac resolve torch from
# PyPI (CPU/MPS) unchanged.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
